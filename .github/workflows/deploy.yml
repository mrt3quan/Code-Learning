name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/gamified-python-learning-phase-0-r4jzsj
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Public worker URL, not a secret. Set this repo variable once the
          # tutor worker is deployed (Settings > Secrets and variables >
          # Actions > Variables). Left unset, the app just falls back to the
          # static explanation/hint content.
          VITE_TUTOR_API_URL: ${{ vars.TUTOR_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
